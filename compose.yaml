services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/selfsigned.crt:/etc/nginx/certs/selfsigned.crt:ro
      - ./nginx/selfsigned.key:/etc/nginx/certs/selfsigned.key:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STOCK_MIN_LIMIT: ${STOCK_MIN_LIMIT}
      STOCK_MAX_LIMIT: ${STOCK_MAX_LIMIT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
#    ports:
#      - "8080:8080"
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
  app_logs: