inventory:
  stock:
    max-limit: 1000000  # real business limit, whatever that actually is
  pagination:
    default-size: 20

logging:
  level:
    com.millenniumitesp.productinventoryservice: WARN  # minimal noise in prod
    org.hibernate.SQL: ERROR

spring:
  jpa:
    show-sql: false  # never log raw SQL in production - performance + security
  docker:
    compose:
      enabled: false

server:
  port: 8080