spring.application.name=product-inventory-service

spring.docker.compose.enabled=false
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

inventory.stock.min-limit=${STOCK_MIN_LIMIT:0}
inventory.stock.max-limit=${STOCK_MAX_LIMIT:100000}