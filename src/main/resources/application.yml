spring:
  application:
    name: product-inventory-service
  docker:
    compose:
      enabled: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

inventory:
  stock:
    min-limit: ${STOCK_MIN_LIMIT:0}
    max-limit: ${STOCK_MAX_LIMIT:100000}